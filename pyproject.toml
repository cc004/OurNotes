[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ournotes-client"
version = "0.1.0"
description = "OurNotes local APK pipeline and protocol client"
requires-python = ">=3.11"
dependencies = ["nnnotes==0.1.3", "protobuf>=5,<8", "capstone>=5,<6", "pyelftools>=0.31,<1"]

[project.scripts]
ournotes = "ournotes.cli:entrypoint"

[tool.setuptools]
packages = ["ournotes"]
